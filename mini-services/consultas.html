<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MutanoX | Consultas Gratuitas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2ff;
            --secondary: #7000ff;
            --accent: #ff00c8;
            --bg-darker: #050505;
            --bg-dark: #0a0a0a;
            --card-bg: rgba(15, 15, 15, 0.9);
            --border: rgba(0, 242, 255, 0.2);
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg-darker);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .announcement-bar {
            width: 100%;
            max-width: 800px;
            background: linear-gradient(90deg, var(--secondary), var(--primary));
            padding: 12px 20px;
            border-radius: 12px;
            text-align: center;
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 32px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            display: none;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 56px;
            font-weight: 900;
            letter-spacing: -3px;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            filter: drop-shadow(0 0 15px var(--primary-glow));
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px;
            backdrop-filter: blur(25px);
            margin-bottom: 24px;
            box-shadow: 0 0 40px rgba(0, 242, 255, 0.1);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(0, 242, 255, 0.3);
        }
        .card:hover {
            box-shadow: 0 0 60px rgba(0, 242, 255, 0.2);
            border-color: var(--primary);
        }
        .card::after {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: conic-gradient(transparent, transparent, transparent, var(--primary));
            animation: rotate 4s linear infinite;
            z-index: -1;
            opacity: 0.3;
        }
        @keyframes rotate { 100% { transform: rotate(360deg); } }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        .form-input {
            width: 100%;
            padding: 16px;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: white;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        .form-input:focus { border-color: var(--primary); }

        .btn {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
            font-weight: 800;
            font-size: 16px;
            cursor: pointer;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
        }
        .btn:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 0 40px rgba(0, 242, 255, 0.4);
            filter: brightness(1.1);
        }
        .btn:disabled { background: #334155; cursor: not-allowed; transform: none; }

        .results-container {
            margin-top: 32px;
            display: none;
        }

        .result-card {
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid var(--primary);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 16px;
            animation: fadeIn 0.5s ease;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .result-label { color: var(--text-muted); font-size: 13px; font-weight: 600; }
        .result-value { color: var(--primary); font-weight: 700; font-family: 'JetBrains Mono', monospace; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .system-closed {
            text-align: center;
            padding: 60px 20px;
            display: none;
        }

        .system-closed i { font-size: 64px; color: var(--danger); margin-bottom: 24px; }

        /* Mobile Adjustments */
        @media (max-width: 480px) {
            .header h1 { font-size: 24px; }
            .card { padding: 20px; }
            .result-item { flex-direction: column; gap: 4px; }
            .result-value { font-size: 14px; }
        }
    </style>
</head>
<body>

    <div id="announcement" class="announcement-bar"></div>

    <div id="main-app" class="container">
        <div class="lang-selector" style="position: fixed; top: 20px; right: 20px; display: flex; gap: 10px; z-index: 1000; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 50px; backdrop-filter: blur(10px); border: 1px solid var(--border);">
            <button onclick="setLanguage('pt')" class="btn" style="padding: 8px 15px; width: auto; font-size: 12px; background: transparent; border: none; display: flex; align-items: center; gap: 5px; color: white;">🇧🇷 <span class="lang-text">PT</span></button>
            <div style="width: 1px; height: 20px; background: var(--border); align-self: center;"></div>
            <button onclick="setLanguage('en')" class="btn" style="padding: 8px 15px; width: auto; font-size: 12px; background: transparent; border: none; display: flex; align-items: center; gap: 5px; color: white;">🇺🇸 <span class="lang-text">EN</span></button>
        </div>
        <div class="header">
            <h1>MUTANOX <span style="color: white;">FREE</span></h1>
            <p id="sub-title" style="color: var(--text-muted);">Consultas Gratuitas Limitadas</p>
            <div id="ad-banner" style="margin-top: 20px; padding: 15px; background: rgba(0, 242, 255, 0.1); border: 1px dashed var(--primary); border-radius: 12px; display: none;">
                <a id="ad-link" href="#" target="_blank" style="color: var(--primary); text-decoration: none; font-weight: 800; font-size: 14px;"></a>
            </div>
            <div id="stats-widget" style="margin-top: 20px; display: none; justify-content: center; gap: 20px;">
                <div style="background: var(--card-bg); padding: 10px 20px; border-radius: 10px; border: 1px solid var(--border);">
                    <div style="font-size: 10px; color: var(--text-muted);">TOTAL REQUESTS</div>
                    <div id="widget-total" style="font-weight: 800; color: var(--primary);">0</div>
                </div>
                <div style="background: var(--card-bg); padding: 10px 20px; border-radius: 10px; border: 1px solid var(--border);">
                    <div style="font-size: 10px; color: var(--text-muted);">UPTIME</div>
                    <div id="widget-uptime" style="font-weight: 800; color: var(--primary);">0%</div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="input-group">
                <label id="label-tipo">Tipo de Consulta</label>
                <select id="search-type" class="form-input" style="appearance: none;" onchange="updatePlaceholder()">
                    <option value="cpf">CPF</option>
                    <option value="nome">Nome Completo</option>
                    <option value="numero">Telefone</option>
                    <option value="bypasscf">Bypass Cloudflare (URL)</option>
                    <option value="infoff">Free Fire Info (ID)</option>
                    <option value="downloader">AIO Downloader (URL)</option>
                    <option value="github">GitHub Search (User)</option>
                    <option value="gimage">Google Images (Query)</option>
                    <option value="pinterest">Pinterest Search (Query)</option>
                    <option value="roblox">Roblox Stalk (User)</option>
                    <option value="tiktok">TikTok Search (User)</option>
                    <option value="yt">YouTube Search (Query)</option>
                    <option value="video">Text to Video (Prompt)</option>
                    <option value="nsfw">NSFW Generator (Prompt)</option>
                    <option value="bypass">Bypass City (URL)</option>
                </select>
            </div>
            <div class="input-group">
                <label id="label-dados">Dados para Consulta</label>
                <input type="text" id="search-query" class="form-input" placeholder="Ex: 000.000.000-00">
            </div>
            <button id="search-btn" class="btn" onclick="performSearch()">Consultar Agora</button>
        </div>

        <div id="queue-status" style="margin-top: 20px; padding: 15px; background: rgba(245, 158, 11, 0.1); border: 1px solid var(--warning); border-radius: 12px; display: none; align-items: center; gap: 10px;">
            <i class="fas fa-clock fa-spin" style="color: var(--warning);"></i>
            <span style="color: var(--warning); font-size: 13px; font-weight: 600;">Você está na fila de processamento. Aguarde alguns segundos...</span>
        </div>
        <div id="results" class="results-container"></div>
        
        <!-- Feedback System -->
        <div id="feedback-section" class="card" style="display: none; margin-top: 30px; text-align: center;">
            <h4 style="margin-bottom: 15px; color: var(--primary);">Avalie esta consulta</h4>
            <div style="display: flex; justify-content: center; gap: 15px; margin-bottom: 15px;">
                <i class="fas fa-star feedback-star" data-value="1" onclick="setRating(1)" style="cursor: pointer; font-size: 24px; color: var(--text-muted);"></i>
                <i class="fas fa-star feedback-star" data-value="2" onclick="setRating(2)" style="cursor: pointer; font-size: 24px; color: var(--text-muted);"></i>
                <i class="fas fa-star feedback-star" data-value="3" onclick="setRating(3)" style="cursor: pointer; font-size: 24px; color: var(--text-muted);"></i>
                <i class="fas fa-star feedback-star" data-value="4" onclick="setRating(4)" style="cursor: pointer; font-size: 24px; color: var(--text-muted);"></i>
                <i class="fas fa-star feedback-star" data-value="5" onclick="setRating(5)" style="cursor: pointer; font-size: 24px; color: var(--text-muted);"></i>
            </div>
            <textarea id="feedback-comment" class="form-input" placeholder="Opcional: Deixe um comentário sobre a precisão dos dados..." rows="2" style="margin-bottom: 15px;"></textarea>
            <button class="btn btn-primary" onclick="sendFeedback()">Enviar Avaliação</button>
        </div>
    </div>

    <div id="closed-screen" class="system-closed">
        <i class="fas fa-lock"></i>
        <h2>SISTEMA FECHADO</h2>
        <p style="color: var(--text-muted); margin-top: 16px;">As consultas gratuitas estão temporariamente desativadas.</p>
        <div style="margin-top: 25px;">
            <a href="https://t.me/MutanoX" target="_blank" class="btn btn-primary" style="text-decoration: none; display: inline-block; width: auto; padding: 12px 30px;">ADQUIRIR ACESSO VIP</a>
        </div>
    </div>

    <script src="/mini-services/consultas.js"></script>
    <script>
        async function applyDynamicStyles() {
            try {
                const res = await fetch('/api/admin/stats?apikey=MutanoX3397');
                const data = await res.json();
                if (data.success && data.config) {
                    const root = document.documentElement;
                    if (data.config.primaryColor) root.style.setProperty('--primary', data.config.primaryColor);
                    if (data.config.secondaryColor) root.style.setProperty('--secondary', data.config.secondaryColor);
                    
                    if (data.config.showStatsWidget) {
                        document.getElementById('stats-widget').style.display = 'flex';
                        document.getElementById('widget-total').innerText = data.totalRequests.toLocaleString();
                        document.getElementById('widget-uptime').innerText = '99.9%';
                    }

                    if (data.config.layoutType === 'minimal') {
                        document.querySelector('.card').style.boxShadow = 'none';
                        document.querySelector('.card').style.border = '1px solid var(--border)';
                    } else if (data.config.layoutType === 'classic') {
                        document.body.style.background = '#f0f2f5';
                        document.body.style.color = '#1a1a1a';
                        document.querySelector('.card').style.background = '#ffffff';
                    }
                }
            } catch (e) {}
        }
        applyDynamicStyles();
    </script>
</body>
</html>
